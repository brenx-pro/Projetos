<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Lista de Tarefas</title>
<style>
  /* ===== VARIÁVEIS DE COR (fica fácil trocar o tema depois) ===== */
  :root {
    --bg: #101314;
    --panel: #181c1e;
    --panel-border: #262b2d;
    --text: #eef1f0;
    --text-dim: #8b9491;
    --accent: #3e9e33;
    --accent-dim: #2e5f4e;
    --done: #4b5451;
    --danger: #c0382e;
    --font-display: 'Georgia', serif;
    --font-body: 'Helvetica Neue', Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 64px 20px;
  }

  .app {
    width: 100%;
    max-width: 460px;
  }

  .app-header {
    margin-bottom: 28px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px 0;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 32px;
    margin: 0 0 6px 0;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0;
  }

  /* ===== FORMULÁRIO DE ADICIONAR TAREFA ===== */
  .add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }

  #task-input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 15px;
    font-family: var(--font-body);
  }

  #task-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  #task-input::placeholder {
    color: var(--text-dim);
  }

  #add-btn {
    background: var(--accent);
    color: #0a0f0d;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  #add-btn:hover { opacity: 0.85; }
  #add-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  /* ===== CONTADOR DE PROGRESSO ===== */
  .progress {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .progress-bar {
    height: 3px;
    background: var(--panel-border);
    border-radius: 2px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.25s ease;
  }

  /* ===== LISTA DE TAREFAS ===== */
  #task-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px 14px;
    animation: slide-in 0.15s ease;
  }

  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .task-checkbox {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    border: 1.5px solid var(--text-dim);
    border-radius: 5px;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .task-checkbox.checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .task-checkbox svg {
    display: none;
    width: 11px;
    height: 11px;
  }

  .task-checkbox.checked svg { display: block; }

  .task-text {
    flex: 1;
    font-size: 14.5px;
    word-break: break-word;
  }

  .task-item.completed .task-text {
    color: var(--done);
    text-decoration: line-through;
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    padding: 4px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .delete-btn:hover { color: var(--danger); }
  .delete-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  /* ===== ESTADO VAZIO ===== */
  .empty-state {
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    padding: 40px 0;
    border: 1px dashed var(--panel-border);
    border-radius: 8px;
  }

  @media (prefers-reduced-motion: reduce) {
    .task-item { animation: none; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="app-header">
    <p class="eyebrow">Projeto To-Do-List</p>
    <h1>Minha Lista de Tarefas</h1>
    <p class="subtitle">Adicione, conclua e remova tarefas.</p>
  </div>

  <!-- Formulário para adicionar novas tarefas -->
  <form class="add-form" id="add-form">
    <input
      type="text"
      id="task-input"
      placeholder="O que temos para hoje ?"
      autocomplete="off"
    >
    <button type="submit" id="add-btn">Adicionar</button>
  </form>

  <div class="progress">
    <span id="progress-text">0 de 0 concluídas</span>
  </div>
  <div class="progress-bar">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>

  <!-- A lista de tarefas é construída dinamicamente pelo JavaScript -->
  <ul id="task-list"></ul>
</div>

<script>
  // ===================================================================
  // ESTADO DA APLICAÇÃO
  // Guardamos as tarefas em um array de objetos. Cada tarefa tem:
  // - id: identificador único (usamos a data/hora atual)
  // - text: o texto da tarefa
  // - completed: se está marcada como concluída ou não
  // ===================================================================
  let tasks = [];

  // Pegando os elementos do HTML que vamos manipular
  const form = document.getElementById('add-form');
  const input = document.getElementById('task-input');
  const list = document.getElementById('task-list');
  const progressText = document.getElementById('progress-text');
  const progressFill = document.getElementById('progress-fill');

  // ===================================================================
  // FUNÇÃO: adicionar uma nova tarefa
  // ===================================================================
  function addTask(text) {
    tasks.push({
      id: Date.now(),       // Date.now() gera um número único baseado no horário
      text: text,
      completed: false
    });
    render();
  }

  // ===================================================================
  // FUNÇÃO: marcar/desmarcar uma tarefa como concluída
  // ===================================================================
  function toggleTask(id) {
    // .map() percorre o array e devolve um novo array modificado
    tasks = tasks.map(task =>
      task.id === id ? { ...task, completed: !task.completed } : task
    );
    render();
  }

  // ===================================================================
  // FUNÇÃO: remover uma tarefa
  // ===================================================================
  function deleteTask(id) {
    // .filter() devolve um novo array só com os itens que NÃO têm esse id
    tasks = tasks.filter(task => task.id !== id);
    render();
  }

  // ===================================================================
  // FUNÇÃO: desenhar a lista na tela
  // Toda vez que os dados mudam, chamamos render() para atualizar o HTML
  // ===================================================================
  function render() {
    // Limpa a lista atual
    list.innerHTML = '';

    if (tasks.length === 0) {
      list.innerHTML = '<li class="empty-state">Nenhuma tarefa ainda. Adicione a primeira acima ↑</li>';
    }

    tasks.forEach(task => {
      // Cria o <li> da tarefa
      const li = document.createElement('li');
      li.className = 'task-item' + (task.completed ? ' completed' : '');

      // Cria o checkbox (usamos um <button> estilizado em vez de <input type="checkbox">
      // para ter controle total do visual)
      const checkbox = document.createElement('button');
      checkbox.className = 'task-checkbox' + (task.completed ? ' checked' : '');
      checkbox.setAttribute('aria-label', 'Marcar tarefa como concluída');
      checkbox.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="#0a0f0d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      checkbox.addEventListener('click', () => toggleTask(task.id));

      // Cria o texto da tarefa
      const span = document.createElement('span');
      span.className = 'task-text';
      span.textContent = task.text;

      // Cria o botão de remover
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = 'remover';
      deleteBtn.addEventListener('click', () => deleteTask(task.id));

      // Junta tudo dentro do <li>
      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(deleteBtn);
      list.appendChild(li);
    });

    // Atualiza o contador e a barra de progresso
    const total = tasks.length;
    const done = tasks.filter(t => t.completed).length;
    progressText.textContent = `${done} de ${total} concluídas`;
    progressFill.style.width = total === 0 ? '0%' : `${(done / total) * 100}%`;
  }

  // ===================================================================
  // EVENTO: quando o formulário é enviado (botão "Adicionar" ou Enter)
  // ===================================================================
  form.addEventListener('submit', (event) => {
    event.preventDefault(); // impede a página de recarregar
    const text = input.value.trim();
    if (text === '') return; // não adiciona tarefa vazia
    addTask(text);
    input.value = '';
    input.focus();
  });

  // Desenha a lista vazia assim que a página carrega
  render();
</script>

</body>
</html>
